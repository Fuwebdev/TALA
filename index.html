    <link rel="manifest" href="/manifest.json" />

    <!-- Geometric Monolithic Webfont for Mobile Preview & Cross-Device Consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=Questrial&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/monolithic" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/century-gothic-paneuropean" rel="stylesheet" />

    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Early Cache Self-Heal, Chrome Redirect & Direct PWA Install Capture Script -->
    <script>
      (function () {
        window.__deferredPwaPrompt = null;

        // 1. Purge any legacy cache-first Service Worker caches (v1/v2/v3) that caused white screen on redeploy
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              if (key !== 'tala-cache-v4') {
                caches.delete(key);
              }
            });
          }).catch(function () {});
        }

        // Auto-recover if a stale cached HTML ever fails to load a new Vite JS/CSS asset
        window.addEventListener(
          'error',
          function (e) {
            var target = e.target || e.srcElement;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              if (!sessionStorage.getItem('tala_asset_reload_once')) {
                sessionStorage.setItem('tala_asset_reload_once', '1');
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function (regs) {
                    Promise.all(regs.map(function (r) { return r.unregister(); })).finally(function () {
                      window.location.reload();
                    });
                  });
                } else {
                  window.location.reload();
                }
              }
            }
          },
          true
        );

        // 2. Capture Chrome's native beforeinstallprompt immediately before React mounts
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('tala-pwa-ready', { detail: e }));
        });

        window.addEventListener('appinstalled', function () {
          window.__deferredPwaPrompt = null;
          try {
            localStorage.setItem('tala_pwa_installed_v1', 'true');
          } catch (err) {}
          window.dispatchEvent(new CustomEvent('tala-pwa-installed'));
        });

        // 3. Register & force-update Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              reg.update();
            })
            .catch(function () {});
        }

        // 4. Auto-redirect in-app browsers (Messenger, Facebook, Instagram, TikTok, etc.) on Android directly to Google Chrome
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isInAppWebView = /(FBAN|FBAV|Messenger|Instagram|BytedanceWebview|TikTok|Line|MicroMessenger|Twitter|Snapchat|wv)/i.test(ua);
        var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;

        if (isAndroid && isInAppWebView && !isStandalone && !sessionStorage.getItem('tala_chrome_intent_fired')) {
          try {
            sessionStorage.setItem('tala_chrome_intent_fired', '1');
            var hostAndPath = window.location.host + window.location.pathname + window.location.search;
            var fallback = encodeURIComponent(window.location.href);
            window.location.replace(
              'intent://' + hostAndPath + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + fallback + ';end'
            );
          } catch (err) {}
        }
      })();
    </script>
  </head>
  <body style="background-color: #030712; color: #f8fafc;" class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-sky-500 selection:text-white min-h-screen">
